<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";

const params = new URLSearchParams(location.search);
const KIND = params.get("kind") || "tee";          // "tee" | "tank"
const SIZE = +(params.get("size") || 1200);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20);

/* ---------- lights: studio key + strong rims so black fabric reads ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1.6, 2.2, 2.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(2.0, 0.6, 1.8); scene.add(fill);
const rimL = new THREE.DirectionalLight(0xffffff, 2.6); rimL.position.set(-2.4, 1.2, -2.0); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xfff4e6, 2.2); rimR.position.set(2.6, 1.6, -1.6); scene.add(rimR);
const top = new THREE.DirectionalLight(0xffffff, 0.8); top.position.set(0, 3, 0.4); scene.add(top);

/* ---------- helpers ---------- */
function noise3(x, y, z) { // cheap smooth pseudo-noise from sines
  return (Math.sin(x * 1.7 + Math.sin(y * 2.3 + z)) + Math.sin(y * 3.1 + Math.sin(z * 1.9 + x * 0.7)) +
          Math.sin(z * 2.6 + Math.sin(x * 2.9 - y))) / 3;
}
function lerp(a, b, t) { return a + (b - a) * t; }

// profile: list of [y, halfWidth, halfDepth]; interpolated with a Catmull-Rom curve
function makeProfile(pts) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), false, "centripetal");
  return t => curve.getPoint(t);
}
function superEllipse(theta, w, d, n) {
  const s = Math.sin(theta), c = Math.cos(theta);
  return [w * Math.sign(s) * Math.pow(Math.abs(s), 2 / n), d * Math.sign(c) * Math.pow(Math.abs(c), 2 / n)];
}

/* ---------- textures: knit bump, color map with the printed logo, alpha cutouts ---------- */
const logoImg = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = "logo.png"; });

function knitCanvas(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  const id = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = (j * w + i) * 4;
    const rib = 0.5 + 0.5 * Math.sin(i * 1.9) * Math.sin(j * 0.95 + (i % 2) * 1.2);
    const v = 120 + rib * 60 + (Math.random() - 0.5) * 40;
    id.data[k] = id.data[k + 1] = id.data[k + 2] = v; id.data[k + 3] = 255;
  }
  x.putImageData(id, 0, 0); return c;
}

/* ---------- garment builder ---------- */
const FABRIC = 0x141414, FABRIC_IN = 0x0a0a0a, INK = "#ffffff";

function buildBody(opts) {
  const { profile, NU = 220, NV = 160, n = 2.6, neckDip = 0, logo } = opts;
  const pos = [], uv = [], idx = [];
  // first pass: ring points + arc-length u (0 = back centre, 0.5 = front centre)
  const rings = [];
  let yMax = 0;
  for (let j = 0; j <= NV; j++) {
    const t = j / NV, p = profile(t);
    const ring = [];
    for (let i = 0; i <= NU; i++) {
      const th = Math.PI + (i / NU) * Math.PI * 2;      // start at back centre
      let [x, z] = superEllipse(th, p.y, p.z, n);
      let y = p.x;
      // front neckline dips lower than the back
      const front = Math.max(0, Math.cos(th));
      y -= neckDip * Math.pow(front, 2.2) * Math.pow(t, 10);
      // soft folds and a slight drape
      const fold = 0.0028 * noise3(x * 5, y * 3.5, z * 5) + 0.0012 * noise3(x * 13 + 3, y * 9, z * 13);
      const r = Math.hypot(x, z) || 1;
      x += (x / r) * fold; z += (z / r) * fold;
      ring.push([x, y, z]);
      yMax = Math.max(yMax, y);
    }
    // arc length around the ring
    const L = [0];
    for (let i = 1; i <= NU; i++) { const a = ring[i - 1], b = ring[i]; L.push(L[i - 1] + Math.hypot(b[0] - a[0], b[2] - a[2])); }
    rings.push({ ring, L, per: L[NU] });
  }
  for (let j = 0; j <= NV; j++) {
    const { ring, L, per } = rings[j];
    for (let i = 0; i <= NU; i++) {
      const [x, y, z] = ring[i];
      pos.push(x, y, z);
      uv.push(L[i] / per, y / yMax);
    }
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const a = j * (NU + 1) + i, b = a + 1, c = a + NU + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();

  // colour map: fabric + printed logo, sized in metres using the ring perimeter at logo height
  const TW = 4096, TH = 2048;
  const cc = document.createElement("canvas"); cc.width = TW; cc.height = TH; const cx = cc.getContext("2d");
  cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, TW, TH);
  const bc = document.createElement("canvas"); bc.width = TW; bc.height = TH; const bx = bc.getContext("2d");
  bx.fillStyle = "#000"; bx.fillRect(0, 0, TW, TH);
  if (logo) {
    const jy = Math.round(NV * logo.t), per = rings[jy].per;
    const wU = logo.width / per;                          // fraction of circumference
    const hV = (logo.width * logoImg.height / logoImg.width) / yMax;
    const lw = wU * TW, lh = hV * TH, lx = (0.5 - wU / 2) * TW, ly = (1 - logo.y / yMax - hV / 2) * TH;
    // tint the white logo to the ink colour, then multiply onto white -> black fabric shows through elsewhere
    const tc = document.createElement("canvas"); tc.width = Math.ceil(lw); tc.height = Math.ceil(lh); const tx = tc.getContext("2d");
    tx.drawImage(logoImg, 0, 0, lw, lh); tx.globalCompositeOperation = "source-in"; tx.fillStyle = INK; tx.fillRect(0, 0, lw, lh);
    logoMask = { x: lx, y: ly, w: lw, h: lh, img: tc };
    // bump: logo slightly raised (layered heat transfer)
    bx.drawImage(logoImg, lx, ly, lw, lh);
  }
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8;
  const bump = new THREE.CanvasTexture(bc);
  return { geo: g, mapCanvas: cc, map, bump, rings, yMax };
}
let logoMask = null;

function fabricMaterials(extra = {}) {
  const knit = new THREE.CanvasTexture(knitCanvas(256, 256));
  knit.wrapS = knit.wrapT = THREE.RepeatWrapping; knit.repeat.set(60, 40);
  const outer = new THREE.MeshPhysicalMaterial({
    color: FABRIC, roughness: 0.82, metalness: 0, bumpMap: knit, bumpScale: 0.6,
    sheen: 1, sheenColor: new THREE.Color(0x5a5a5a), sheenRoughness: 0.45, side: THREE.FrontSide, ...extra
  });
  const inner = new THREE.MeshStandardMaterial({ color: FABRIC_IN, roughness: 0.95, side: THREE.BackSide, ...("alphaMap" in extra ? { alphaMap: extra.alphaMap, alphaTest: 0.5 } : {}) });
  return { outer, inner, knit };
}

// logo as its own thin layer on the body so it stays crisp and slightly glossy, like a heat transfer
function logoLayer(body, bodyGeo, alphaMap) {
  const c = document.createElement("canvas"); c.width = body.mapCanvas.width; c.height = body.mapCanvas.height;
  const x = c.getContext("2d");
  x.drawImage(logoMask.img, logoMask.x, logoMask.y, logoMask.w, logoMask.h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const g = bodyGeo.clone();
  // push out a hair along the normal
  const p = g.attributes.position, nrm = g.attributes.normal;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + nrm.getX(i) * 0.0012, p.getY(i) + nrm.getY(i) * 0.0012, p.getZ(i) + nrm.getZ(i) * 0.0012);
  const m = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.5, metalness: 0, alphaTest: 0.25, depthWrite: false, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.32 });
  return new THREE.Mesh(g, m);
}

function tube(points, radius, radial = 24, tubular = 60, scaleR = null) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const g = new THREE.TubeGeometry(curve, tubular, radius, radial, false);
  return g;
}

// short sleeve: an elliptical tube from the shoulder seam out and down
function sleeve(side) {
  const NU = 64, NV = 40;
  const root = new THREE.Vector3(side * 0.198, 0.532, 0.0);
  const dir = new THREE.Vector3(side * Math.cos(-0.92), Math.sin(-0.92), 0).normalize();   // ~53° below horizontal
  const len = 0.175;
  const up = new THREE.Vector3(0, 0, 1);
  const a1 = new THREE.Vector3().crossVectors(dir, up).normalize();  // in the x-y plane, perpendicular to dir
  const pos = [], idx = [];
  for (let j = 0; j <= NV; j++) {
    const t = j / NV;
    const ra = lerp(0.098, 0.074, Math.pow(t, 0.8)), rb = lerp(0.082, 0.07, t); // a: up-down, b: front-back
    const c = root.clone().addScaledVector(dir, t * len);
    for (let i = 0; i <= NU; i++) {
      const th = (i / NU) * Math.PI * 2;
      const wob = 1 + 0.02 * noise3(t * 6, th * 2, side);
      const p = c.clone().addScaledVector(a1, Math.cos(th) * ra * wob).addScaledVector(up, Math.sin(th) * rb * wob);
      pos.push(p.x, p.y, p.z);
    }
  }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const a = j * (NU + 1) + i, b = a + 1, c = a + NU + 1, d = c + 1;
    side > 0 ? idx.push(a, b, c, b, d, c) : idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  // cuff ring
  const end = root.clone().addScaledVector(dir, len);
  const ringPts = [];
  for (let i = 0; i <= 64; i++) { const th = i / 64 * Math.PI * 2; const p = end.clone().addScaledVector(a1, Math.cos(th) * 0.074).addScaledVector(up, Math.sin(th) * 0.07); ringPts.push([p.x, p.y, p.z]); }
  return { geo: g, cuff: ringPts };
}

const garment = new THREE.Group();
scene.add(garment);

if (KIND === "tee") {
  // Metal Vent Tech tee: slim fit, crew neck, short sleeves
  const profile = makeProfile([
    [0.000, 0.238, 0.128],
    [0.140, 0.226, 0.124],
    [0.300, 0.236, 0.132],
    [0.440, 0.246, 0.136],
    [0.530, 0.240, 0.130],
    [0.580, 0.212, 0.112],
    [0.615, 0.150, 0.094],
    [0.640, 0.088, 0.072],
  ]);
  const body = buildBody({ profile, neckDip: 0.03, logo: { t: 0.6, y: 0.405, width: 0.235 } });
  const { outer, inner } = fabricMaterials({ map: body.map });
  garment.add(new THREE.Mesh(body.geo, outer), new THREE.Mesh(body.geo, inner));
  garment.add(logoLayer(body, body.geo));
  // neck rib + hem
  const top = body.rings[body.rings.length - 1].ring.filter((_, i) => i % 3 === 0).map(p => [p[0] * 1.01, p[1], p[2] * 1.01]);
  top.push(top[0]);
  garment.add(new THREE.Mesh(tube(top, 0.0085, 12, 200), new THREE.MeshPhysicalMaterial({ color: 0x161616, roughness: 0.7, sheen: 1, sheenColor: new THREE.Color(0x606060) })));
  const hem = body.rings[1].ring.filter((_, i) => i % 3 === 0).map(p => [p[0] * 1.004, p[1], p[2] * 1.004]); hem.push(hem[0]);
  garment.add(new THREE.Mesh(tube(hem, 0.004, 8, 200), outer));
  for (const side of [-1, 1]) {
    const s = sleeve(side);
    const so = outer.clone(); so.side = THREE.DoubleSide; garment.add(new THREE.Mesh(s.geo, so));
    garment.add(new THREE.Mesh(tube(s.cuff, 0.0045, 8, 120), outer));
  }
  garment.position.y = -0.33;
} else {
  // Align waist-length racerback tank: tight fit, scoop neck, racerback
  const profile = makeProfile([
    [0.000, 0.168, 0.106],
    [0.110, 0.160, 0.104],
    [0.230, 0.182, 0.118],
    [0.300, 0.188, 0.120],
    [0.360, 0.176, 0.110],
    [0.430, 0.140, 0.094],
    [0.480, 0.112, 0.084],
  ]);
  const ARM_Y = 0.335, TOP_Y = 0.48;
  // alpha mask in (u = arc fraction from back centre, v = y / yMax)
  const body = buildBody({ profile, NU: 260, NV: 180, n: 2.4, logo: { t: 0.5, y: 0.255, width: 0.165 } });
  const AW = 2048, AH = 1024, ac = document.createElement("canvas"); ac.width = AW; ac.height = AH;
  const ax = ac.getContext("2d"), aid = ax.createImageData(AW, AH);
  for (let py = 0; py < AH; py++) {
    const y = (1 - (py + 0.5) / AH) * body.yMax;
    const s = Math.min(1, Math.max(0, (y - ARM_Y) / (TOP_Y - ARM_Y)));
    for (let px = 0; px < AW; px++) {
      const u = (px + 0.5) / AW;
      let keep = true;
      if (y > ARM_Y) {
        const df = Math.abs(u - 0.5);                       // distance from front centre
        const db = Math.min(u, 1 - u);                      // distance from back centre
        const frontHalf = 0.215 - 0.085 * Math.pow(s, 0.7);   // armholes cut in from the sides
        const scoop = s > 0.1 ? 0.088 * Math.pow((s - 0.1) / 0.9, 0.55) : 0; // scoop neck
        const backHalf = 0.19 * Math.pow(1 - s, 2.2) + 0.024;  // racerback narrows to a centre strap
        keep = (df < frontHalf && df > scoop) || db < backHalf;
      }
      const k = (py * AW + px) * 4;
      aid.data[k] = aid.data[k + 1] = aid.data[k + 2] = keep ? 255 : 0; aid.data[k + 3] = 255;
    }
  }
  ax.putImageData(aid, 0, 0);
  const alphaMap = new THREE.CanvasTexture(ac);
  const { outer, inner } = fabricMaterials({ map: body.map, alphaMap, alphaTest: 0.5, side: THREE.FrontSide });
  garment.add(new THREE.Mesh(body.geo, outer), new THREE.Mesh(body.geo, inner));
  garment.add(logoLayer(body, body.geo));
  // straps over the shoulders: from the top of each front strap to the top of the back strap
  const yMax = body.yMax;
  const ringAt = y => body.rings.reduce((best, r) => Math.abs(r.ring[0][1] - y) < Math.abs(best.ring[0][1] - y) ? r : best);
  const topRing = ringAt(TOP_Y - 0.004);
  const pointAtU = (r, u) => { const i = r.L.findIndex(l => l / r.per >= u); return r.ring[Math.max(0, i)]; };
  const strapMat = new THREE.MeshPhysicalMaterial({ color: FABRIC, roughness: 0.82, sheen: 1, sheenColor: new THREE.Color(0x5a5a5a), sheenRoughness: 0.45 });
  for (const side of [-1, 1]) {
    const uF = 0.5 + side * 0.109;
    const pf = pointAtU(topRing, uF), pb = pointAtU(topRing, side > 0 ? 0.012 : 0.988);
    const g = tube([[pf[0], pf[1] - 0.006, pf[2]], [pf[0] * 1.02, pf[1] + 0.012, pf[2] * 0.35],
                    [pf[0] * 0.75, pf[1] + 0.014, pf[2] * -0.25], [pb[0] + side * 0.03, pb[1] + 0.006, pb[2] * 0.85],
                    [pb[0], pb[1] - 0.006, pb[2]]], 0.0085, 14, 60);
    g.scale(1, 1, 1);
    garment.add(new THREE.Mesh(g, strapMat));
  }
  // bound edges: thin tubes along the cut edges read as the finished binding
  garment.position.y = -0.245;
}

/* ---------- contact shadow so it floats ---------- */
const sc = document.createElement("canvas"); sc.width = sc.height = 256; const sx = sc.getContext("2d");
const grd = sx.createRadialGradient(128, 128, 0, 128, 128, 128);
grd.addColorStop(0, "rgba(0,0,0,0.38)"); grd.addColorStop(0.55, "rgba(0,0,0,0.14)"); grd.addColorStop(1, "rgba(0,0,0,0)");
sx.fillStyle = grd; sx.fillRect(0, 0, 256, 256);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.26), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2;
const FLOOR = KIND === "tee" ? -0.47 : -0.37;
shadow.position.y = FLOOR; scene.add(shadow);

/* ---------- camera + frame API ---------- */
const camDist = KIND === "tee" ? 2.35 : 1.95;
camera.position.set(0, 0.26, camDist);
camera.lookAt(0, KIND === "tee" ? -0.02 : -0.02, 0);

window.renderFrame = (i, n) => {
  const t = i / n;
  garment.rotation.y = t * Math.PI * 2;
  const bob = Math.sin(t * Math.PI * 4) * 0.012;        // two gentle bobs per turn, loops cleanly
  garment.position.y = (KIND === "tee" ? -0.33 : -0.245) + bob;
  garment.rotation.z = Math.sin(t * Math.PI * 2) * 0.025;
  const s = 1 - bob * 4;
  shadow.scale.set(s, s, 1); shadow.material.opacity = 0.9 - bob * 10;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png");
};
window.ready = true;
</script>
</body></html>
